name: entrelinhas-nosql

services:
  mongo:
    image: mongo:7.0
    command: [mongod, --replSet, rs0, --bind_ip_all]
    ports:
      - '127.0.0.1:27018:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { quit(rs.status().myState === 1 ? 0 : 1) } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}); quit(1) }"
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  api:
    build: .
    ports:
      - '127.0.0.1:5000:8000'
    environment:
      APP_ENV: development
      STORAGE_BACKEND: mongodb
      MONGODB_URI: mongodb://mongo:27017/?replicaSet=rs0&directConnection=true
      MONGODB_DATABASE: entrelinhas
      MONGODB_COLLECTION: livraria
      SECRET_KEY: ${SECRET_KEY:-desenvolvimento-local-altere-antes-de-publicar}
      ALLOWED_ORIGINS: http://127.0.0.1:8080,http://localhost:8080
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  client:
    image: nginx:stable-alpine
    ports:
      - '127.0.0.1:8080:80'
    volumes:
      - ./client:/usr/share/nginx/html:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  mongo-data:
